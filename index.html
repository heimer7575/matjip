<style>

:root{

  --hero:#1f0a15; --hero-2:#3a1026; --on-hero:#ffffff; --on-hero-muted:#d9b3c3;
  --good:#5fd3a2; --good-soft:#15302a; --warn:#f2bd5a; --warn-soft:#352914; --bad:#ff8f80; --bad-soft:#3a1d19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121014; --surface:#1d1a20; --fg:#f2eff5; --muted:#a59eac; --line:#322d37;
  --accent:#ff6f9c; --accent-soft:#3b1826; --accent2:#ff8a63;
  --hero:#1f0a15; --hero-2:#3a1026; --on-hero:#ffffff; --on-hero-muted:#d9b3c3;
  --good:#5fd3a2; --good-soft:#15302a; --warn:#f2bd5a; --warn-soft:#352914; --bad:#ff8f80; --bad-soft:#3a1d19;

.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:6;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}

.callbar .n{flex:1;min-width:0;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}.callbar small{display:block;font-weight:400;font-size:12px;opacity:.75}

@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</script>
<script>
const CATS=["한식","고기·구이","일식·스시","중식","양식·이탈리안","프렌치·파인다이닝","해산물·회","아시안","주점·이자카야","기타"];
const CATS2=["디저트·카페","맥주·호프","와인바","칵테일·위스키바","포차·이자카야","노래방·기타"];
const PURP=["회식","모임","접대","골프","가족","데이트"];
const CCOL={"한식":"#e8590c","고기·구이":"#c2255c","일식·스시":"#1c7ed6","중식":"#e03131","양식·이탈리안":"#2f9e44","프렌치·파인다이닝":"#7048e8","해산물·회":"#0c8599","아시안":"#e67700","주점·이자카야":"#9c36b5","기타":"#868e96",
  "디저트·카페":"#e64980","맥주·호프":"#f08c00","와인바":"#a61e4d","칵테일·위스키바":"#4c6ef5","포차·이자카야":"#fd7e14","노래방·기타":"#12b886"};
const ccol=c=>CCOL[c]||"#868e96";
const TT={"한식":"한식","고기·구이":"고기","일식·스시":"일식","중식":"중식","양식·이탈리안":"양식","프렌치·파인다이닝":"파인","해산물·회":"해산","아시안":"아시","주점·이자카야":"주점","디저트·카페":"카페","맥주·호프":"맥주","와인바":"와인","칵테일·위스키바":"Bar","포차·이자카야":"포차"};
const tileTxt=p=>TT[p.category]||(p.kind==="2차"?"2차":"맛집");
function regionOf(p){ if(p.region)return p.region; const a=String(p.address||"");
  const m=a.match(/([가-힣]{1,4}구)(?=\s|$)/)||a.match(/([가-힣]{1,4}시)(?=\s|$)/)||a.match(/([가-힣]{1,4}군)(?=\s|$)/);
  if(m&&!/특별시|광역시/.test(m[1]))return m[1]; return p.area||"지역 미정" }
const WD=["일","월","화","수","목","금","토"];
let places=[], resv=[], db=null, mcp=null, sample=null, state={tab:"all",q:"",f:{},cat:"",price:"",region:"",view:"date",near:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>n?Number(n).toLocaleString("ko-KR")+"원":"";
const man=n=>!n?"":(n>=10000?(Math.round(n/1000)/10).toString().replace(/\.0$/,"")+"만원":Number(n).toLocaleString()+"원");
function dkey(iso){const d=new Date(iso||Date.now());return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")+" ("+WD[d.getDay()]+")"}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function safeUrl(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:""}
const isCT=u=>/catchtable|ctable\.|catch-table/i.test(String(u||""));
const ctIn=t=>((String(t||"").match(/https?:\/\/[^\s<>"']*(?:catchtable|ctable\.|catch-table)[^\s<>"']*/i)||[])[0]||"");
function telNum(p){return String(p||"").replace(/[^\d+]/g,"")}
const ANDROID=/Android/i.test(navigator.userAgent);

/* ---------- 데이터 ---------- */
function cork(p){const c=p.corkage||{};
  if(c.status==="free")return{t:"콜키지 무료",k:"good"};
  if(c.status==="paid")return{t:"콜키지 "+(c.fee?man(c.fee)+"/병":"유료"),k:"warn"};
  if(c.status==="no")return{t:"콜키지 불가",k:"bad"};
  return{t:"콜키지 확인필요",k:""}}
function room(p){const r=p.room||{};
  if(r.status==="yes"){let t="룸 있음"+(r.capacity?" · 최대 "+r.capacity+"인":"");return{t,k:"good"}}
  if(r.status==="no")return{t:"룸 없음",k:"bad"};return{t:"룸 확인필요",k:""}}
function charge(p){const r=p.room||{};if(r.status!=="yes")return null;
  if(r.charge>0)return{t:"룸차지 "+man(r.charge),k:"warn"};if(r.charge===0||r.chargeNone)return{t:"룸차지 없음",k:"good"};return{t:"룸차지 확인필요",k:""}}
function depo(p){const d=p.deposit||{};
  if(d.status==="yes")return{t:"예약금 "+(d.amount?man(d.amount):"있음"),k:"warn"};
  if(d.status==="no")return{t:"예약금 없음",k:"good"};return null}

async function boot(){
  render();
  try{ if(window.claude?.use){ const [d,m,s]=await Promise.all([claude.use("db"),claude.use("mcp"),claude.use("sample")]); db=d; mcp=m; sample=s; } }catch(e){}
  if(!db){ $("#main").innerHTML='<div class="empty"><b>저장소에 연결하지 못했습니다.</b><br>claude.ai에 로그인한 상태에서 열어 주세요.</div>'; return }
  let done=false; const timer=setTimeout(()=>{if(!done){$("#main").innerHTML='<div class="empty">불러오는 데 시간이 걸리고 있습니다. 잠시 후 다시 열어 주세요.</div>'}},10000);
  subResv();
  db.collection("places").onSnapshot(snap=>{done=true;clearTimeout(timer);places=snap.docs.map(d=>({id:d.id,...d.data()}));render();routeHash()},
    e=>{done=true;clearTimeout(timer);$("#main").innerHTML='<div class="empty status err">불러오기 실패: '+esc(e?.message||e?.code)+'</div>'});
}
function subResv(){db.collection("reservations").onSnapshot(s=>{resv=s.docs.map(d=>({id:d.id,...d.data()}));if(state.tab==="resv")render()},()=>{})}
function fillCat(){const s=$("#fCat");if(s.options.length>1)return;[...CATS,...CATS2].forEach(c=>s.add(new Option(c,c)))}

/* ---------- 목록 ---------- */
function filtered(){
  const q=state.q.trim().toLowerCase(), f=state.f;
  return places.filter(p=>{
    if(state.tab==="2차"){ if(p.kind!=="2차")return false }
    else if(state.tab!=="all"){ if(p.kind==="2차"||!(p.purposes||[]).includes(state.tab))return false }
    if(q && ![p.name,p.area,p.address,p.category,p.menu,p.memo,regionOf(p)].join(" ").toLowerCase().includes(q))return false;
    if(state.region && regionOf(p)!==state.region)return false;
    if(f.corkFree && p.corkage?.status!=="free")return false;
    if(f.corkOk && !["free","paid"].includes(p.corkage?.status))return false;
    if(f.room && p.room?.status!=="yes")return false;
    if(f.noCharge && !(p.room?.status==="yes" && (p.room.charge===0||p.room.chargeNone)))return false;
    if(f.noDeposit && p.deposit?.status!=="no")return false;
    if(f.ct && !isCT(p.reserveUrl))return false;
    if(state.cat && p.category!==state.cat)return false;
    if(state.price){const [a,b]=state.price.split("-").map(Number); if(!p.pricePer||p.pricePer<a||p.pricePer>b)return false}
    return true}).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
}
function cardHTML(p){
  const bs=[cork(p),room(p),charge(p),depo(p)].filter(Boolean);
  const ph=telNum(p.phone), nav=safeUrl(p.naverUrl), rs=safeUrl(p.reserveUrl)||nav;
  return `<article class="card" data-id="${esc(p.id)}">
    <div class="row1"><div class="tile" style="--c:${ccol(p.category)}">${esc(tileTxt(p))}</div><div class="tx"><h3>${esc(p.name||"(이름 미정)")}</h3>
      <div class="meta">${esc([p.kind==="2차"?"2차":"",p.category,regionOf(p),p.area&&p.area!==regionOf(p)?p.area:""].filter(Boolean).join(" · "))}${p.status==="inbox"?` · <span style="color:var(--accent)">${p.queued?"자동 정리 대기":"정리 필요"}</span>`:""}</div></div>
      <div class="price">${p.pricePer?"인당 "+man(p.pricePer):""}</div></div>
    ${p.kind==="2차"?"":`<div class="badges">${bs.map(b=>`<span class="b ${b.k}">${esc(b.t)}</span>`).join("")}${(p.purposes||[]).map(x=>`<span class="b acc">${esc(x)}</span>`).join("")}${isCT(p.reserveUrl)?'<span class="b" style="background:#fff0eb;color:#e0400f;border-color:transparent">캐치테이블</span>':""}</div>`}
    <div class="actions">
      <button type="button" ${ph?`class="btn tel" data-num="${esc(p.phone)}" data-nm="${esc(p.name)}"`:'class="btn" aria-disabled="true"'}>${ico("phone")}전화</button>
      <button class="btn pri" data-book="${esc(p.id)}">${ico("cal")}바로 예약</button>
      <a class="btn" ${nav?`href="${esc(nav)}" target="_blank" rel="noopener"`:'aria-disabled="true"'} data-stop>${ico("pin")}${isNaver(nav)?"네이버":"홈페이지"}</a>
    </div></article>`}
function ico(n){const d={phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',pin:'<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'}[n];return `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`}

function render(){
  fillCat();
  $("#count").textContent=places.length?`식당 ${places.filter(p=>p.kind!=="2차").length} · 2차 ${places.filter(p=>p.kind==="2차").length}`:"";
  $("#tools").hidden=["rec","links","resv","near","golf"].includes(state.tab);
  renderRegions();
  const m=$("#main");
  if(state.tab==="rec")return renderRec();
  if(state.tab==="links")return renderLinks();
  if(state.tab==="resv")return renderResv();
  if(state.tab==="near")return renderNear();
  if(state.tab==="golf")return renderGolf();
  if(!places.length){m.innerHTML=`<div class="empty"><b>아직 저장한 곳이 없습니다.</b> 이렇게 시작하세요.
    <ol><li>네이버 지도에서 가고 싶은 식당 → <b>공유 → 링크 복사</b></li>
    <li>오른쪽 아래 <b>+ 맛집 추가</b>에 붙여넣고 <b>자동 정리</b></li>
    <li>콜키지 · 룸 · 룸차지 · 예약금 중 비어 있는 항목은 전화로 확인 후 입력</li></ol></div>`;return}
  const list=filtered();
  if(!list.length){m.innerHTML='<div class="empty">조건에 맞는 곳이 없습니다. 필터를 줄여 보세요.</div>';return}
  let h="",last="";
  if(state.view==="region"){
    const g={};list.forEach(p=>{(g[regionOf(p)]=g[regionOf(p)]||[]).push(p)});
    Object.keys(g).sort((a,b)=>g[b].length-g[a].length||a.localeCompare(b,"ko")).forEach(r=>{h+=`<div class="rgrp">${esc(r)}<small>${g[r].length}곳</small></div><div class="list">${g[r].map(cardHTML).join("")}</div>`});
    m.innerHTML=h;return}
  for(const p of list){const k=dkey(p.createdAt);if(k!==last){h+=(last?"</div>":"")+`<div class="dategrp">${k} 저장</div><div class="list">`;last=k}h+=cardHTML(p)}
  m.innerHTML=h+"</div>";
}

function renderRegions(){
  const c={};places.forEach(p=>{const r=regionOf(p);c[r]=(c[r]||0)+1});
  const keys=Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b,"ko"));
  $("#regions").hidden=!keys.length;
  $("#regions").innerHTML=`<button class="chip" data-region="" aria-pressed="${!state.region}">전체 지역<span>${places.length}</span></button>`+
    keys.map(k=>`<button class="chip" data-region="${esc(k)}" aria-pressed="${state.region===k}">${esc(k)}<span>${c[k]}</span></button>`).join("");
}

/* ---------- 근처 찾기 ---------- */
const NQ=[["맛집","지금 인기","#e8590c"],["콜키지 무료","와인 지참","#a61e4d"],["룸 식당","별실 · 프라이빗","#7048e8"],["회식 장소","단체석","#1c7ed6"],
  ["한우","소고기 · 구이","#c2255c"],["오마카세","스시 · 일식","#0c8599"],["중식 룸","코스 요리","#e03131"],["이탈리안","파스타 · 와인","#2f9e44"],
  ["디저트 카페","2차","#e64980"],["와인바","2차","#a61e4d"],["맥주","2차 · 호프","#f08c00"],["칵테일바","2차","#4c6ef5"]];
/* ---------- 골프장 근처 ---------- */
const GQ=[["맛집","라운딩 전후","#2f9e44"],["한식","백반 · 정식","#e8590c"],["해장국","아침 식사","#c2255c"],["갈비","저녁 · 단체","#a61e4d"],
  ["백숙 오리","보양식","#e67700"],["중식","룸 · 코스","#e03131"],["한우","접대","#7048e8"],["카페","라운딩 후","#e64980"]];
const golfOf=p=>String(p.golf||"").trim();
function renderGolf(){
  const golfs=[...new Set(places.map(golfOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
  const base=state.golf??"";
  const list=places.filter(p=>golfOf(p)||(p.purposes||[]).includes("골프"));
  const shown=base?list.filter(p=>golfOf(p).includes(base)):list;
  const g={};shown.forEach(p=>{const k=golfOf(p)||"골프장 미지정";(g[k]=g[k]||[]).push(p)});
  $("#main").innerHTML=`<div class="sec" style="border:0;margin-top:14px">
    <label class="f">골프장 이름<input id="g_base" list="g_list" value="${esc(base)}" placeholder="예: 남서울CC, 레이크사이드"></label>
    <datalist id="g_list">${golfs.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
    ${golfs.length?`<div class="chips"><button class="chip" data-golfpick="" aria-pressed="${!base}">전체</button>${golfs.map(x=>`<button class="chip" data-golfpick="${esc(x)}" aria-pressed="${x===base}">${esc(x)}</button>`).join("")}</div>`:""}
    <p class="note" style="margin:0">식당 수정 화면의 <b>가까운 골프장</b> 칸에 골프장 이름을 넣으면 여기로 모입니다.</p></div>
  ${Object.keys(g).length?Object.keys(g).map(k=>`<div class="rgrp">${esc(k)}<small>${g[k].length}곳</small></div><div class="list">${g[k].map(cardHTML).join("")}</div>`).join("")
    :'<div class="empty">아직 골프장 근처로 저장한 식당이 없습니다.</div>'}
  ${base?`<div class="rgrp">네이버 지도에서 ${esc(base)} 근처 찾기<small>실시간 검색</small></div>
    <div class="qgrid">${GQ.map(([k,d,c])=>`<a class="qbtn" style="--c:${c}" href="https://map.naver.com/p/search/${encodeURIComponent(base+" 근처 "+k)}" target="_blank" rel="noopener"><i></i><b>${esc(k)}</b><span>${esc(d)}</span></a>`).join("")}</div>`:""}`;
  const inp=$("#g_base");inp.addEventListener("change",()=>{state.golf=inp.value.trim();renderGolf()});
}

/* ---------- 카톡 공유 ---------- */
function shareText(p){
  const L=[`[${p.name}]`];
  const sub=[p.category,regionOf(p),p.area&&p.area!==regionOf(p)?p.area:""].filter(Boolean).join(" · ");if(sub)L.push(sub);
  if(p.pricePer)L.push("인당 약 "+man(p.pricePer));
  if(p.kind!=="2차"){const b=[cork(p).t,room(p).t,charge(p)?.t,depo(p)?.t].filter(x=>x&&!/확인필요/.test(x));if(b.length)L.push(b.join(" / "))}
  if(p.golf)L.push("가까운 골프장: "+p.golf);
  if(p.menu)L.push("메뉴: "+p.menu);
  if(p.address)L.push("주소: "+p.address);
  if(p.phone)L.push("전화: "+p.phone);
  if(safeUrl(p.naverUrl))L.push(p.naverUrl);
  return L.join("\n");
}
function resvText(r){const p=places.find(x=>x.id===r.placeId)||{};
  const L=[`[예약 안내] ${r.placeName}`,`${korDate(r.date)} ${korTime(r.time)} · ${r.people}명${r.room?" · 룸":""}`];
  if(p.address)L.push("주소: "+p.address);if(r.phone||p.phone)L.push("전화: "+(r.phone||p.phone));
  if(r.memo)L.push("참고: "+r.memo);if(safeUrl(p.naverUrl))L.push(p.naverUrl);return L.join("\n")}
function openPop(html){closePop();const w=document.createElement("div");w.id="pop";w.innerHTML=`<div class="scrim" style="z-index:50" data-pclose></div><div class="sheet" style="z-index:51" role="dialog" aria-modal="true"><div class="in">${html}</div></div>`;
  w.addEventListener("click",ev=>{if(ev.target.closest("[data-pclose]"))closePop()});document.body.append(w);return w}
function closePop(){document.getElementById("pop")?.remove()}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"복사했습니다");return true}catch(_){toast("글을 길게 눌러 복사해 주세요");return false}}
function kakaoShare(text){
  if(navigator.share){navigator.share({text}).catch(err=>{if(err&&err.name!=="AbortError")kakaoPop(text)});return}
  kakaoPop(text);
}
function kakaoPop(text){
  const w=openPop(`<div class="shead"><h2>카톡으로 보내기</h2><button class="x" data-pclose aria-label="닫기">×</button></div>
    <textarea id="sh_txt" rows="8" readonly style="font-size:14px;line-height:1.6"></textarea>
    <button class="btn pri" type="button" id="sh_copy" style="background:#fee500;color:#191919;border-color:#fee500;flex:none;padding:12px">① 내용 복사하기</button>
    <div class="status" style="line-height:1.7"><b>② 카카오톡 앱을 열고</b> 보낼 대화방에서 입력칸을 길게 눌러 <b>붙여넣기</b> 하세요.<br>
    또는 위 글을 길게 눌러 <b>전체 선택 → 공유 → 카카오톡</b>을 고르면 대화방 선택 화면으로 바로 넘어갑니다.</div>`);
  w.querySelector("#sh_txt").value=text;
  w.querySelector("#sh_copy").onclick=()=>copyText(text,"복사했습니다. 카카오톡에 붙여넣기 하세요");
}
function showCallBar(num,nm){
  const n=telNum(num);
  const w=openPop(`<div class="shead"><div><h2>전화 걸기</h2><div class="meta">${esc(nm||"")}</div></div><button class="x" data-pclose aria-label="닫기">×</button></div>
    <div style="text-align:center;padding:14px 0;border:1px solid var(--line);border-radius:14px;background:var(--bg)">
      <div style="font-size:30px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text">${esc(num)}</div></div>

function scoreP(p){
  let s=0,why=[];const pp=p.pricePer, c=p.corkage||{}, r=p.room||{};
  if(pp){ if(pp<=rq.budget){s+=30;why.push(["예산 안","good"])} else if(pp<=rq.budget*1.2){s+=10;why.push(["예산 약간 초과","warn"])} else {s-=25;why.push(["예산 초과","bad"])} } else why.push(["가격 확인필요",""]);
  if((p.purposes||[]).includes(rq.purpose)){s+=25;why.push([rq.purpose+" 적합","acc"])}
  if(rq.needRoom){ if(r.status==="yes"){s+=20; if(r.capacity){ if(r.capacity>=rq.people){s+=10;why.push([`룸 ${r.capacity}인 가능`,"good"])} else {s-=20;why.push([`룸 ${r.capacity}인(부족)`,"bad"])} } else why.push(["룸 있음","good"])} else if(r.status==="no"){s-=40;why.push(["룸 없음","bad"])} else why.push(["룸 확인필요",""]) }
  if(rq.wine>0){ if(c.status==="free"){s+=20;why.push(["콜키지 무료","good"])} else if(c.status==="paid"){s+=8;why.push(["콜키지 유료","warn"])} else if(c.status==="no"){s-=40;why.push(["콜키지 불가","bad"])} else why.push(["콜키지 확인필요",""]) }
  if(p.deposit?.status==="no")s+=5;
  if(rq.area && ![p.area,p.address].join(" ").includes(rq.area))s-=30;
  const rc=(r.status==="yes"&&r.charge>0)?r.charge:0, cf=(c.status==="paid"&&c.fee?c.fee*rq.wine:0);
  const total=pp?pp*rq.people+rc+cf:null;
  return {p,s,why,total,rc,cf}}
function recOut(){
  const R=places.filter(p=>p.kind!=="2차").map(scoreP).sort((a,b)=>b.s-a.s).slice(0,10);
  if(!R.length){$("#recOut").innerHTML='<div class="empty">식당을 먼저 저장하면 조건에 맞춰 순위를 매겨 드립니다.</div>';return}

    <div class="price" style="text-align:right">${x.total?`예상 ${man(x.total)}<div class="meta" style="font-weight:400">인당 ${man(x.p.pricePer)}${x.rc?` + 룸 ${man(x.rc)}`:""}${x.cf?` + 콜키지 ${man(x.cf)}`:""}</div>`:'<span class="meta">가격 미입력</span>'}</div></div>
    <div class="badges">${x.why.map(w=>`<span class="b ${w[1]}">${esc(w[0])}</span>`).join("")}</div></div>`).join("");
}

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function korDate(s){if(!s)return"";const d=new Date(s+"T00:00");return (d.getMonth()+1)+"월 "+d.getDate()+"일("+WD[d.getDay()]+")"}
function korTime(t){if(!t)return"";const [h,m]=t.split(":").map(Number);return (h<12?"오전 ":"오후 ")+(h%12||12)+"시"+(m?" "+m+"분":"")}
function bookScript(p,b){
  const c=p.corkage||{},r=p.room||{},d=p.deposit||{},q=[];
  if(b.room&&r.status!=="yes")q.push("룸(별실) 이용이 가능한지");
  if(b.room&&!(r.charge>0||r.chargeNone||r.charge===0))q.push("룸차지가 있는지, 있다면 얼마인지");
  if(b.wine>0&&!["free","paid","no"].includes(c.status))q.push("와인 "+b.wine+"병 지참 시 콜키지가 되는지, 병당 얼마인지");
  else if(b.wine>0&&c.status==="paid")q.push("콜키지가 병당 "+(c.fee?man(c.fee):"얼마")+"가 맞는지");
  if(d.status!=="yes"&&d.status!=="no")q.push("예약금이 있는지");
  let s=`안녕하세요, 예약 문의드립니다.\n${korDate(b.date)} ${korTime(b.time)}, ${b.people}명${b.room?" 룸으로":""} 예약 가능할까요?`;
  if(b.wine>0)s+=`\n와인을 ${b.wine}병 가져가려고 합니다.`;
  if(q.length)s+="\n그리고 "+q.join(", ")+" 여쭤봐도 될까요?";
  if(b.memo)s+="\n요청사항: "+b.memo;
  s+=`\n예약자는 ${b.who||"홍현기"}입니다. 감사합니다.`;
  return {s,q};
}

  else{const c=m(/콜키지[^\n]{0,15}?(\d[\d,]*)\s*(만\s*원|천\s*원|원)/);if(c){ck.status="paid";ck.fee=/천/.test(c[2])?money(c[1])*1000:money(c[1],c[2])}}

  const cap=m(/최대\s*(\d+)\s*(명|인)/)||m(/(\d+)\s*(명|인)\s*(까지|룸|이상)/);if(cap)rm.capacity=Number(cap[1]);
  if(/룸\s*차지[^\n]{0,8}?(없|무료|X|x)/.test(T)){rm.charge=0;rm.chargeNone=true}
  else{const c=m(/룸\s*차지[^\n]{0,10}?(\d[\d,]*)\s*(만\s*원|원)/);if(c)rm.charge=money(c[1],c[2])}
  const rml=lines.find(l=>/(룸|별실|단체)/.test(l)&&!/콜키지/.test(l));if(rml)rm.note=rml.slice(0,60);
  const dp={status:"unknown",amount:0,note:""};
  if(/예약금[^\n]{0,8}?(없|무|X|x)/.test(T))dp.status="no";
  else{const c=m(/예약금[^\n]{0,15}?(\d[\d,]*)\s*(만\s*원|원)/);if(c){dp.status="yes";dp.amount=money(c[1],c[2])}else if(/예약금/.test(T))dp.status="yes"}

  const memo=lines.filter(l=>/(휴무|주차|발렛|예약|마감|웨이팅|추천)/.test(l)&&l.length<120).slice(0,3).join(" / ");

    menu:"",pricePer:pp?money(pp[1],pp[2]):0,reserveUrl:ctIn(T),purposes:[],corkage:ck,room:rm,deposit:dp,memo};

async function autoOrganize(){
  const info=$("#a_info").value.trim();
  const raw=$("#a_text").value.trim(), url=safeUrl((raw.match(/https?:\/\/[^\s<>"']+/)||[])[0]), kind=$("#a_kind").value;
  const pasted=raw.replace(/https?:\/\/[^\s<>"']+/g,"").trim().length>4?raw:"";
  if(!url&&!pasted&&!info){setSt("링크나 정보 · 특이사항 중 하나는 넣어 주세요.","err");return}
  const go=$("#a_go");go.setAttribute("aria-disabled","true");
  let text=[pasted,info].filter(Boolean).join("\n\n"), pid="";
  try{
    let fails=[];
    if(url && isNaver(url) && !(pasted&&pasted.length>300) && !info){
      const nm=(raw.match(/\[네이버 ?지도\]\s*\n?\s*([^\n]+)/)||[])[1]||"";
      const dup=places.find(x=>x.naverUrl===url);
      if(dup){setSt("이미 저장된 링크입니다: "+esc(dup.name||"(이름 미정)"),"err");go.removeAttribute("aria-disabled");return}
      await savePlace({name:nm.trim(),kind,naverUrl:url,status:"inbox",source:"manual"});
      toast("정리 대기열에 넣었습니다");goHome();return;
    }
    if(url && isCT(url) && !info && !(pasted&&pasted.length>300)){
      showEdit({kind,reserveUrl:url,source:"manual"});
      setTimeout(()=>toast("캐치테이블 링크를 예약 링크에 넣었습니다. 가게 이름을 입력해 주세요"),300);return;
    }
    if(url && !isNaver(url) && !(pasted&&pasted.length>300)){
      if(mcp){const r=await readUrl(url); if(r.text){text=(r.text+"\n\n"+text).trim();pid=r.id||""} else fails=r.fails||[]}
      else fails=["이 앱은 링크 페이지를 직접 읽지 못합니다"];
    }
    if(!text||text.length<(info?4:40)){setSt(`링크를 읽지 못했습니다${fails.length?" ("+esc(fails.join(" / "))+")":""}.<br>페이지 글을 복사해 붙여넣거나 <b>링크만 저장</b>해 두세요.`,"err");go.removeAttribute("aria-disabled");return}
    setSt("내용을 항목별로 정리하는 중입니다…");
    const doc={...(await parseInfo(text,kind)),kind,naverUrl:url||"",placeId:pid,source:"naver-auto",status:"done"};
    if(info&&!doc.memo)doc.memo=info.slice(0,300);
    if(!doc.name){setSt("가게 이름을 찾지 못했습니다. 직접 입력으로 넘어갑니다.","err");showEdit({...doc,source:"manual"});return}
    showEdit(doc,true);
  }catch(e){
    const c=e?.code;
    setSt(c==="not_granted"||c==="cancelled"?"허용하지 않아 자동 정리를 멈췄습니다. 네이버 화면 글을 붙여넣거나 직접 입력해 주세요."
      :c==="server_not_connected"?"Claude 데스크톱 앱에서 열어야 링크를 읽을 수 있습니다. 네이버 화면 글을 붙여넣어 주세요."
      :c==="rate_limited"?"잠시 후 다시 시도해 주세요.":"자동 정리 실패("+esc(c||e?.message||"오류")+"). 네이버 화면 글을 붙여넣거나 직접 입력해 주세요.","err");
    go.removeAttribute("aria-disabled");
  }
}

  $("#e_apply").onclick=async()=>{

      put("e_name",j.name,"이름");put("e_cat",j.category,"종류");put("e_region",j.region,"지역");put("e_area",j.area,"동·역");put("e_phone",j.phone,"전화");

      put("e_ck",j.corkage.status,"콜키지");put("e_ckfee",j.corkage.fee,"콜키지 금액");put("e_cknote",j.corkage.note,"콜키지 메모");
      put("e_rm",j.room.status,"룸");put("e_rmcap",j.room.capacity,"룸 인원");
      if(j.room.chargeNone){put("e_rmch","0","룸차지")}else if(j.room.charge>0){put("e_rmch","1","룸차지");put("e_rmchv",j.room.charge,"룸차지 금액")}
      put("e_dp",j.deposit.status,"예약금");put("e_dpv",j.deposit.amount,"예약금 금액");
      const rn=[j.room.note,j.deposit.note].filter(Boolean).join(" / ");if(rn)put("e_rmnote",rn,"룸·예약 메모");
      (j.purposes||[]).forEach(x=>{const b=[...document.querySelectorAll("#e_purp .chip")].find(b=>b.textContent===x);if(b&&b.getAttribute("aria-pressed")!=="true"){b.setAttribute("aria-pressed","true");ch.push("용도 "+x)}});

async function savePlace(doc){
  const now=new Date().toISOString();const id=doc.id||("p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const {id:_,...body}=doc; body.updatedAt=now; body.createdAt=doc.createdAt||now;
  try{await db.collection("places").doc(id).set(body)}catch(e){toast("저장 실패: "+(e?.code||"오류"));throw e}
  return id;
}

function bindBackup(){
  const o=$("#bk_out"),i=$("#bk_in");if(!o||o.dataset.b)return;o.dataset.b=1;
  o.onclick=()=>{const data=JSON.stringify({app:"matjip",savedAt:new Date().toISOString(),...window.LOCALDB.store()},null,1);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="맛집수첩_백업_"+dkey().slice(0,10).replace(/\./g,"")+".json";document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
  i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const n=window.LOCALDB.merge(j);toast(`불러왔습니다 (식당 ${n.places} · 예약 ${n.reservations})`)}catch(e){toast("백업 파일을 읽지 못했습니다")}i.value=""};
}

document.addEventListener("click",async e=>{
  const t=e.target;
  const ct=t.closest("[data-ctname]");if(ct){const nm=ct.dataset.ctname;try{navigator.clipboard.writeText(nm).then(()=>toast("'"+nm+"' 복사됨 · 캐치테이블 검색창에 붙여넣기"),()=>{})}catch(_){}}
  const tl=t.closest(".tel");if(tl){e.stopPropagation();const n=telNum(tl.dataset.num);if(n){window.location.href="tel:"+n}return}
  if(t.closest("[data-stop]")){e.stopPropagation();return}
  if(t.closest("[data-close]")){goHome();return}
  const tab=t.closest("#tabs button");if(tab){state.tab=tab.dataset.tab;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b===tab));render();window.scrollTo(0,0);return}
  const gp=t.closest("[data-golfpick]");if(gp){state.golf=gp.dataset.golfpick;renderGolf();return}
  const sh=t.closest("[data-share]");if(sh){const p=places.find(x=>x.id===sh.dataset.share);if(p)kakaoShare(shareText(p));return}
  const rs2=t.closest("[data-rshare]");if(rs2){const r=resv.find(x=>x.id===rs2.dataset.rshare);if(r)kakaoShare(resvText(r));return}
  const rgn=t.closest("[data-region]");if(rgn){state.region=rgn.dataset.region;render();return}
  const vs=t.closest("#viewSeg button");if(vs){state.view=vs.dataset.v;document.querySelectorAll("#viewSeg button").forEach(b=>b.setAttribute("aria-pressed",b===vs));render();return}
  const np=t.closest("[data-nearpick]");if(np){state.near=np.dataset.nearpick;renderNear();return}
  const ch=t.closest("#filters .chip");if(ch){const k=ch.dataset.f;state.f[k]=!state.f[k];ch.setAttribute("aria-pressed",state.f[k]);render();return}
  const op=t.closest("[data-open]");if(op){location.hash="p-"+op.dataset.open;const p=places.find(x=>x.id===op.dataset.open);if(p){if(p.status==="inbox")showEdit(p);else showDetail(p)}return}
  const card=t.closest(".card[data-id]");if(card&&!t.closest("a,button")){const p=places.find(x=>x.id===card.dataset.id);if(p){location.hash="p-"+p.id;p.status==="inbox"?showEdit(p):showDetail(p)}return}
  const bk=t.closest("[data-book]");if(bk){e.stopPropagation();const p=places.find(x=>x.id===bk.dataset.book);if(p){location.hash="b-"+p.id;showBook(p)}return}
  const rst=t.closest("[data-rst]");if(rst){const r=resv.find(x=>x.id===rst.dataset.rst);if(r){const {id,...body}=r;try{await db.collection("reservations").doc(id).set({...body,status:rst.dataset.v})}catch(_){toast("변경 실패")}}return}
  const ed=t.closest("[data-edit]");if(ed){const p=places.find(x=>x.id===ed.dataset.edit);if(p)showEdit(p);return}
  const cp=t.closest("[data-copy]");if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);toast("번호를 복사했습니다")}catch(_){toast("길게 눌러 번호를 복사해 주세요")}return}
  const vf=t.closest("[data-verify]");if(vf){const p=places.find(x=>x.id===vf.dataset.verify);if(p){await savePlace({...p,verifiedAt:new Date().toISOString()});toast("확인 완료로 표시했습니다");const s=places.find(x=>x.id===p.id);if(s)showDetail(s)}return}
  const dl=t.closest("[data-del]");if(dl){$("#delZone").innerHTML=`<span class="confirm">정말 삭제할까요? <button class="btn sm" id="delYes" style="color:var(--bad)">삭제</button><button class="btn sm" id="delNo">취소</button></span>`;
    $("#delYes").onclick=async()=>{try{await db.collection("places").doc(dl.dataset.del).delete();toast("삭제했습니다");goHome()}catch(e){toast("삭제 실패")}};
    $("#delNo").onclick=()=>{const p=places.find(x=>x.id===dl.dataset.del);if(p)showDetail(p)};return}
});
